<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#191426">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dominion: Crisis — endless</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/data.js" defer></script>
<script src="js/game.js" defer></script>
<script src="js/ui.js" defer></script>
</head>
<body>

<div id="app">
  <header id="topbar">
    <span class="brand">Dominion: Crisis</span>
    <div class="chips">
      <span class="chip wave" id="cWave"></span>
      <span class="chip" id="cTurn"></span>
      <span class="chip" id="cQueue"></span>
      <span class="chip" id="cNext"></span>
      <span class="chip" id="cTier"></span>
    </div>
    <span class="spacer"></span>
    <button class="tbtn wide-only" id="btnDeck">Deck</button>
    <button class="tbtn wide-only" id="btnTrash">Trash</button>
    <button class="tbtn wide-only" id="btnNew">New run</button>
    <button class="tbtn" id="btnLedger" aria-label="Ledger">📜<span class="long"> Ledger</span></button>
    <button class="tbtn" id="btnMenu" aria-label="Settings and menu">⚙<span class="long"> Settings</span></button>
  </header>

  <main id="main">
    <div id="subbar">
      <div id="tabs" role="tablist">
        <button id="tabThreats" role="tab">Threats</button>
        <button id="tabMarket" role="tab">Market <span id="tabBadge" class="badge-n"></span></button>
      </div>
      <div id="jokers"></div>
    </div>

    <div id="board">
      <section class="market-rail">
        <div class="rail-label">Market</div>
        <div class="market" id="market"></div>
      </section>
      <section id="threats"></section>
    </div>

    <div id="bar">
      <div class="res" id="rAct"></div>
      <div class="res" id="rBuy"></div>
      <div class="res coin" id="rCoin"></div>
      <span class="spacer"></span>
      <button class="pile" id="pTreas" title="Play every Treasure in your hand (T)">▶ Treasures</button>
      <button class="pile" id="pDeck" title="View your draw pile"></button>
      <button class="pile" id="pDisc" title="View your discard pile"></button>
      <button id="endturn" title="End turn (E)">End turn</button>
    </div>

    <div id="handwrap"><div id="hand"></div></div>
  </main>

  <aside id="side">
    <div class="side-h"><span>LEDGER</span><button id="sideClose" aria-label="Close ledger">✕</button></div>
    <div id="log"></div>
  </aside>
</div>

<div id="toasts" aria-live="polite"></div>

<div id="inspect" role="dialog" aria-modal="true">
  <div id="inspectBody"></div>
  <div id="inspectInfo"></div>
  <div class="mbtns" id="inspectBtns"></div>
</div>

<div id="menu" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
  <div class="sheet">
    <h3 id="menuTitle">Settings</h3>
    <div class="srow">
      <span class="slabel">UI size</span>
      <button class="sbtn" id="sDown" aria-label="Smaller">−</button>
      <input type="range" id="sRange" min="60" max="160" step="5" aria-label="UI size">
      <button class="sbtn" id="sUp" aria-label="Larger">+</button>
      <span id="sVal">100%</span>
    </div>
    <div class="srow hint"><span id="sEff"></span><button class="tbtn" id="sAuto">Reset</button></div>
    <label class="srow check"><input type="checkbox" id="sTap"> Tap a card to read it before playing or buying</label>
    <div class="srow btns">
      <button class="tbtn" id="mDeck">Deck</button>
      <button class="tbtn" id="mTrash">Trash</button>
      <button class="tbtn" id="mLedger">Ledger</button>
      <button class="tbtn" id="mNew">New run</button>
    </div>
    <p class="hint">Keys: <b>E</b> end turn · <b>T</b> play treasures · <b>+ / −</b> UI size · right-click any card to read it.</p>
    <button class="mbtn go" id="mClose">Done</button>
  </div>
</div>

<div id="veil" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <h2 id="mTitle"></h2>
  <div class="sub" id="mSub"></div>
  <div id="pool"></div>
  <div class="opts" id="mOpts"></div>
  <div class="mbtns" id="mBtns"></div>
</div>

<div id="over">
  <h1 id="overTitle">Run over</h1>
  <p id="overText"></p>
  <button class="mbtn go" id="overBtn">Start a new run</button>
</div>

</body>
</html>
