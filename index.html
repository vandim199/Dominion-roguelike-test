<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1A2354">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Coinkeep: Forays</title>
<meta name="description" content="Coinkeep: Forays. Your hand makes Powder, your board burns it. Go out, get beaten, go home, come back trillions stronger.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/data.js" defer></script>
<script src="js/game.js" defer></script>
<script src="js/save.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/versions.js" defer></script>
</head>
<body>

<!-- Home -->
<section id="keep" class="screen" hidden>
  <header class="kbar">
    <div class="kstat"><span class="lbl">Coin</span><b id="kCoin" class="gold num"></b></div>
    <div class="kstat"><span class="lbl">Power</span><b id="kPower" class="num"></b></div>
    <div class="kstat"><span class="lbl">Deepest</span><b id="kDeep" class="num"></b></div>
    <div class="kstat" id="kCrestBox"><span class="lbl">Crests</span><b id="kCrest" class="num"></b></div>
    <button class="ghost" id="kMenu" aria-label="Back to title">☰</button>
  </header>
  <div id="kRematch" class="rematch"></div>
  <svg id="kStairs" class="stairs" viewBox="0 0 300 44" preserveAspectRatio="none" aria-hidden="true"></svg>
  <nav class="tabs" id="kTabs">
    <button data-t="spend">Spend</button><button data-t="board">Board</button><button data-t="deck">Deck</button><button data-t="works">Works</button>
  </nav>
  <div id="kBody" class="kbody"></div>
  <footer class="kfoot">
    <div class="stepper"><button class="ghost" id="kFm" aria-label="Start one fight earlier">−</button><span id="kF"></span><button class="ghost" id="kFp" aria-label="Start one fight later">+</button></div>
    <button class="go" id="kGo">Set out</button>
  </footer>
</section>

<!-- A fight -->
<section id="fight" class="screen" hidden>
  <header class="fbar">
    <span id="fF" class="chip"></span>
    <span id="fCoin" class="chip gold num"></span>
    <span id="fOdds" class="chip num"></span>
    <span class="spacer"></span>
    <button class="ghost" id="fMenu" aria-label="Give up this trip">⚑</button>
  </header>
  <div id="coach" class="coach" hidden></div>
  <div class="enemy" id="enemy">
    <div class="eart" id="eArt"></div>
    <div class="emain">
      <div class="ehead"><b id="eName"></b><span id="eStat" class="estat"></span></div>
      <div class="bar ehp"><i id="eBar"></i><span id="eHp" class="num"></span></div>
      <div class="intent" id="eIntent"></div>
      <div class="next" id="eNext"></div>
    </div>
  </div>
  <div class="boardwrap">
    <div class="feedlbl"><span>Powder runs this way ➜</span><span id="fSwap"></span></div>
    <div id="board" class="board"></div>
  </div>
  <div class="you">
    <div class="ytop">
      <div class="bar yhp"><i id="yBar"></i><span id="yHp" class="num"></span></div>
      <span id="yShield" class="chip blue num"></span>
    </div>
    <div class="ybot">
      <span id="yEnergy" class="pips"></span>
      <span id="yMag" class="chip num"></span>
      <span id="yStat" class="ystat"></span>
      <span class="spacer"></span>
      <span id="yPiles" class="piles"></span>
    </div>
  </div>
  <div id="hand" class="hand"></div>
  <div class="factions">
    <button class="ghost" id="fAuto">Auto turn</button>
    <button class="go" id="fEnd">End turn</button>
  </div>
</section>

<!-- Between fights, end of a trip, keep-a-spoil -->
<div id="sheet" class="sheet" hidden><div id="sheetBox" class="sheetbox" role="dialog" aria-modal="true"></div></div>
<div id="fx" aria-hidden="true"></div>

<div id="title" class="screen on" role="dialog" aria-modal="true" aria-labelledby="tName">
  <div class="logo">
    <div class="logo-art">🏰</div>
    <h1 id="tName">Coinkeep</h1>
    <p class="tag">Forays. Your hand makes Powder, your board burns it. Get beaten, go home, come back with more zeroes.</p>
  </div>
  <p class="best" id="tBest"></p>
  <button class="go big" id="tPlay">Play</button>
  <button class="ghost" id="tHow">How to play</button>
  <button class="ghost" id="tClassic">Classic mode</button>
  <button class="ghost danger" id="tWipe" hidden>Erase this save</button>
  <div class="versions" id="tVersions" hidden></div>
</div>

</body>
</html>
