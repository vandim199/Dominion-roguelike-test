<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Coinkeep: Forays</title>
<meta name="description" content="Coinkeep: Forays. Tap your deck, set off chains of cards and bastions, march out from the Keep, go home richer, reach the trillions.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/style.css">
<script src="js/data.js" defer></script>
<script src="js/game.js" defer></script>
<script src="js/save.js" defer></script>
<script src="js/sfx.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/versions.js" defer></script>
</head>
<body>
<div id="title" class="screen">
  <h1>Coinkeep</h1>
  <p class="sub">Forays</p>
  <p class="tag">Tap the deck. Feed the guns. Come home richer.</p>
  <div id="tSummary" class="tsum"></div>
  <button class="btn gold" id="tPlay">Play</button>
  <button class="btn" id="tNew" hidden>New game</button>
  <button class="btn" id="tClassic">Classic mode</button>
  <button class="btn" id="tHow">How to play</button>
  <div class="versions" id="tVersions" hidden></div>
</div>
<div id="home" class="screen" hidden></div>
<div id="fight" class="screen" hidden></div>
<div id="sheet" class="sheet" hidden></div>
<div id="march" class="sheet march" hidden></div>
<div id="fx" aria-hidden="true"></div>
</body>
</html>
