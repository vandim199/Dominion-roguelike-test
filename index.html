<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dominion: Crisis — endless</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1A1526; --ink-2:#231D33; --ink-3:#2E2743; --edge:#453A5F;
  --parch:#E9DEC4; --parch-2:#D8C9A5;
  --gold:#C9A24A; --crimson:#AE3546; --green:#5E8C54; --violet:#7A5AA8; --blue:#4C6E9C;
  --text:#EDE6D8; --dim:#9C90B0;
  --card-w:110px; --card-h:156px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 700px at 50% -10%, #2E2743 0%, transparent 60%),
             linear-gradient(180deg,#191426 0%,#120F1C 100%);
  color:var(--text);font-family:"Crimson Pro",Georgia,serif;font-size:16px;overflow:hidden;
}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:none}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#app{display:grid;grid-template-columns:1fr 260px;grid-template-rows:auto 1fr;height:100vh}
#topbar{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--edge);background:rgba(0,0,0,.25);flex-wrap:wrap}
.brand{font-family:Cinzel,serif;font-weight:700;letter-spacing:.06em;color:var(--gold);font-size:15px}
.chip{font-family:Cinzel,serif;font-size:13px;padding:3px 12px;border:1px solid var(--edge);border-radius:2px;background:var(--ink-2)}
.chip.wave{border-color:var(--gold);color:#F0D48E}
.chip.soon{border-color:#C0762F;color:#EFB463}
.chip.now{border-color:var(--crimson);color:#F09090;animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.5}}
.spacer{flex:1}
.tbtn{font-family:Cinzel,serif;font-size:12px;padding:5px 12px;border:1px solid var(--edge);border-radius:2px;background:var(--ink-2)}
.tbtn:hover{border-color:var(--gold)}

#main{position:relative;display:flex;flex-direction:column;min-height:0;padding:8px 14px 0}
#side{border-left:1px solid var(--edge);background:rgba(0,0,0,.2);display:flex;flex-direction:column;min-height:0}

/* jokers */
#jokers{display:flex;gap:6px;align-items:center;padding:0 0 8px;flex-wrap:wrap}
.jlabel{font-family:Cinzel,serif;font-size:11px;letter-spacing:.14em;color:var(--dim);margin-right:4px}
.joker{position:relative;display:flex;align-items:center;gap:6px;padding:3px 10px 3px 6px;border:1px solid var(--edge);border-radius:3px;
  background:linear-gradient(180deg,#2B2140,#1E1730);font-family:Cinzel,serif;font-size:12px;min-height:28px}
.joker .ja{font-size:17px;line-height:1}
.joker .js{font-family:"Crimson Pro",serif;font-size:12px;color:var(--dim)}
.joker.common{border-color:#6F8FB8}
.joker.uncommon{border-color:#5FA36A}
.joker.rare{border-color:#D9A94A;box-shadow:0 0 8px rgba(217,169,74,.35)}
.joker.empty{border-style:dashed;color:#5C5175;min-width:60px;justify-content:center}
.joker.flash{animation:jflash .5s}
@keyframes jflash{50%{background:#5C4411}}
.jtip{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:50;width:230px;padding:8px 10px;background:#0F0B18;border:1px solid var(--gold);
  border-radius:3px;font-family:"Crimson Pro",serif;font-size:13.5px;line-height:1.35;color:var(--text);box-shadow:0 8px 20px rgba(0,0,0,.6)}
.joker:hover .jtip,.joker:focus .jtip{display:block}

/* market */
.market-rail{display:flex;align-items:center;gap:10px}
.rail-label{font-family:Cinzel,serif;font-size:11px;letter-spacing:.14em;color:var(--dim);writing-mode:vertical-rl;transform:rotate(180deg);height:var(--card-h);display:flex;align-items:center;justify-content:center}
.market{display:flex;gap:8px;flex-wrap:wrap}
.market .slot{position:relative}
.slot.leaving::after{content:"";position:absolute;inset:-3px;border:2px dashed var(--crimson);border-radius:6px;pointer-events:none}
.leaving-tag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-family:Cinzel,serif;font-size:9px;background:var(--crimson);padding:1px 5px;border-radius:2px;white-space:nowrap;z-index:3}

/* threats */
#threats{flex:1;display:flex;align-items:center;justify-content:center;gap:18px;min-height:0;padding:10px 0;overflow-y:auto}
.tslot{width:256px;min-height:224px;border-radius:6px;border:1px solid var(--edge);background:linear-gradient(170deg,#2A2340,#1D1830);
  display:flex;flex-direction:column;padding:12px;gap:7px;position:relative;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.tslot.elite{border-color:#C05263;background:linear-gradient(170deg,#3A2236,#1D1428)}
.tslot.empty{border-style:dashed;border-color:#3A3150;background:rgba(255,255,255,.015);align-items:center;justify-content:center;color:#5C5175;font-family:Cinzel,serif;font-size:12px;letter-spacing:.12em;box-shadow:none}
.tslot.ready{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 6px 18px rgba(0,0,0,.45)}
.tslot.new{animation:drop .45s ease-out}
@keyframes drop{0%{transform:translateY(-26px);opacity:0}100%{transform:none;opacity:1}}
.thead{display:flex;align-items:center;gap:9px}
.tart{font-size:29px;line-height:1}
.tname{font-family:Cinzel,serif;font-size:14.5px;line-height:1.15}
.tkind{font-size:11px;color:var(--dim);letter-spacing:.06em}
.tdesc{font-size:13px;line-height:1.35;color:#CFC5DC;flex:1}
.tatk{font-size:12.5px;line-height:1.3;padding:4px 7px;border-left:2px solid #6B5A86;background:rgba(0,0,0,.2);color:#D7CCE6}
.tatk.imminent{border-left-color:var(--crimson);color:#F3A0A0}
.tbar{height:9px;background:#150F20;border:1px solid var(--edge);border-radius:2px;overflow:hidden}
.tfill{height:100%;background:linear-gradient(180deg,#D8B45C,#9A7526);transition:width .3s}
.tfill.cash{background:linear-gradient(180deg,#D8B45C,#9A7526)}
.tfill.act{background:linear-gradient(180deg,#B487E0,#6B47A0)}
.tfill.buy{background:linear-gradient(180deg,#71A7DE,#3D6DA5)}
.tfill.blood{background:linear-gradient(180deg,#D06A72,#8A2632)}
.tnum{font-family:Cinzel,serif;font-size:12.5px;display:flex;justify-content:space-between;gap:6px}
.tbtn2{font-family:Cinzel,serif;font-size:13px;padding:8px 10px;border-radius:3px;border:1px solid var(--edge);background:var(--ink-3);width:100%}
.tbtn2.go{background:linear-gradient(180deg,#8E6C1E,#5C4411);border-color:var(--gold)}
.tbtn2.go:hover{filter:brightness(1.2)}
.tbtn2.blood{background:linear-gradient(180deg,#8E2A38,#5C1A22);border-color:#C05263}
.tbtn2:disabled{opacity:.36;cursor:default}
.pips{position:absolute;top:-9px;right:8px;display:flex;gap:4px}
.pip{font-size:10px;font-family:Cinzel,serif;background:var(--crimson);padding:1px 7px;border-radius:2px}
.pip.elite{background:#8E6C1E}

/* resource bar */
#bar{display:flex;align-items:center;gap:8px;padding:7px 4px;border-top:1px solid var(--edge);border-bottom:1px solid var(--edge);background:rgba(0,0,0,.22);flex-wrap:wrap}
.res{display:flex;align-items:center;gap:6px;padding:3px 11px;border:1px solid var(--edge);border-radius:2px;background:var(--ink-2);font-size:14px}
.res b{font-family:Cinzel,serif;font-size:16px}
.res.spent{opacity:.32}
.res.coin{border-color:var(--gold);color:#F0D48E}
.pile{font-size:13px;color:var(--dim);border:1px solid var(--edge);border-radius:2px;padding:3px 9px;background:var(--ink-2)}
.pile:hover{color:var(--text);border-color:var(--gold)}
.pile:disabled{opacity:.4;cursor:default}
#endturn{font-family:Cinzel,serif;font-size:14px;letter-spacing:.06em;padding:7px 20px;background:linear-gradient(180deg,#3F6B39,#28461F);border:1px solid #6FA362;border-radius:3px}
#endturn:hover{filter:brightness(1.18)}
#endturn:disabled{filter:grayscale(1) brightness(.6);cursor:default}

/* hand */
#handwrap{padding:12px 14px 16px;display:flex;justify-content:center;align-items:flex-end;min-height:calc(var(--card-h) + 26px)}
#hand{display:flex;justify-content:center;flex-wrap:nowrap}
#hand .card{margin:0 -13px;transition:transform .14s}
#hand .card:hover{transform:translateY(-18px) scale(1.06);z-index:20}

/* cards */
.card{width:var(--card-w);height:var(--card-h);flex:0 0 auto;position:relative;border-radius:5px;padding:5px;
  display:flex;flex-direction:column;background:linear-gradient(170deg,var(--parch),var(--parch-2));
  color:#241C12;border:1px solid #6A5A3A;box-shadow:0 4px 10px rgba(0,0,0,.5);text-align:center;user-select:none}
.card .banner{font-family:Cinzel,serif;font-size:10.5px;font-weight:700;line-height:1.15;padding:3px 2px;border-radius:3px 3px 0 0;color:#1B1420;background:#D5CBB4;border-bottom:1px solid #8A7752;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.t-treasure .banner{background:#E2C266}
.card.t-victory .banner{background:#B9CC86}
.card.t-junk .banner{background:#9A8FA8}
.card.t-curse .banner{background:#8E76BE;color:#160F1E}
.card.r .banner{background:linear-gradient(90deg,#D5CBB4 0%,#D5CBB4 45%,#8FB8D8 55%,#8FB8D8 100%)}
.card.lv1{outline:2px solid #5B9BE0;outline-offset:-4px}
.card.lv2{outline:2px solid #A57BE0;outline-offset:-4px}
.card.lv3{outline:2px solid #E8B840;outline-offset:-4px;background:linear-gradient(170deg,#F4E7C4,#E0C98E)}
.card .art{flex:0 0 30px;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(0,0,0,.06)}
.card .tx{flex:1;font-size:9.3px;line-height:1.22;padding:3px 3px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card .foot{font-family:Cinzel,serif;font-size:8.5px;display:flex;justify-content:space-between;border-top:1px solid #8A7752;padding-top:2px}
.card .cost{position:absolute;left:-6px;bottom:-6px;width:23px;height:23px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#F0D68F,#B5872E);border:1px solid #6A4E17;color:#33240A;
  font-family:Cinzel,serif;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.5)}
.card .badge{position:absolute;right:-6px;top:-8px;font-family:Cinzel,serif;font-size:11px;font-weight:700;padding:1px 6px;border-radius:9px;background:#5C4411;border:1px solid var(--gold);color:#F0D48E}
.card.playable{cursor:pointer;box-shadow:0 0 0 2px var(--gold),0 4px 12px rgba(0,0,0,.55)}
.card.buyable{cursor:pointer;box-shadow:0 0 0 2px var(--green),0 4px 12px rgba(0,0,0,.55)}
.card.selected{box-shadow:0 0 0 3px #E8A33D,0 4px 12px rgba(0,0,0,.55);transform:translateY(-10px)}
.card.dead{filter:grayscale(.6) brightness(.78)}

/* joker cards in the draft */
.jcard{width:160px;min-height:214px;border-radius:6px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;
  background:linear-gradient(170deg,#2E2446,#191326);border:1px solid var(--edge);box-shadow:0 6px 16px rgba(0,0,0,.5);transition:transform .12s}
.jcard:hover,.jcard:focus-visible{transform:translateY(-6px)}
.jcard.common{border-color:#6F8FB8}
.jcard.uncommon{border-color:#5FA36A}
.jcard.rare{border-color:#D9A94A;box-shadow:0 0 14px rgba(217,169,74,.35),0 6px 16px rgba(0,0,0,.5)}
.jcard .jr{font-family:Cinzel,serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.jcard.rare .jr{color:#E8C35A}
.jcard.uncommon .jr{color:#8CCB8F}
.jcard .jart{font-size:38px;line-height:1.1}
.jcard .jn{font-family:Cinzel,serif;font-size:14px;color:var(--gold)}
.jcard .jtx{font-size:14px;line-height:1.35;color:#DCD3E8}

/* log */
.side-h{font-family:Cinzel,serif;font-size:11px;letter-spacing:.14em;color:var(--dim);padding:8px 12px 4px}
#log{flex:1;overflow-y:auto;padding:0 12px 12px;font-size:13.5px;line-height:1.42}
#log div{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.05)}
#log .hl{color:var(--gold)}
#log .bad{color:#E07A7A}
#log .good{color:#89C27E}
#log .turn{color:var(--dim);font-family:Cinzel,serif;font-size:11px;letter-spacing:.1em;padding-top:8px}
#log .wave{color:var(--gold);font-family:Cinzel,serif;font-size:13px;letter-spacing:.1em;padding-top:12px;border-bottom:1px solid var(--gold)}
#log::-webkit-scrollbar{width:7px}
#log::-webkit-scrollbar-thumb{background:var(--edge);border-radius:4px}

/* modal */
#veil{position:fixed;inset:0;background:rgba(8,5,14,.87);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:100;padding:24px}
#veil.on{display:flex}
#veil h2{font-family:Cinzel,serif;font-size:19px;font-weight:500;text-align:center;max-width:680px}
#veil .sub{color:var(--dim);font-size:14px;margin-top:-8px;text-align:center;max-width:680px}
#pool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:1000px;max-height:58vh;overflow-y:auto;padding:12px 8px}
#pool .card{cursor:pointer}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:820px}
.opt{font-family:Cinzel,serif;font-size:14px;padding:10px 20px;border:1px solid var(--edge);border-radius:3px;background:var(--ink-2)}
.opt:hover{border-color:var(--gold);background:var(--ink-3)}
.mbtns{display:flex;gap:10px}
.mbtn{font-family:Cinzel,serif;font-size:13px;padding:8px 22px;border:1px solid var(--edge);border-radius:3px;background:var(--ink-2)}
.mbtn.go{background:linear-gradient(180deg,#3F6B39,#28461F);border-color:#6FA362}
.mbtn:disabled{opacity:.35;cursor:default}
#over{position:fixed;inset:0;background:rgba(8,5,14,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:200;text-align:center;padding:24px}
#over.on{display:flex}
#over h1{font-family:Cinzel,serif;font-size:40px;color:var(--crimson)}
#over p{font-size:17px;color:var(--dim);max-width:560px;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-width:1180px){:root{--card-w:94px;--card-h:132px}#side{display:none}#app{grid-template-columns:1fr}#topbar{grid-column:1}.tslot{width:212px}}
</style>
</head>
<body>

<div id="app">
  <div id="topbar">
    <span class="brand">Dominion: Crisis</span>
    <span class="chip wave" id="cWave">Wave 1</span>
    <span class="chip" id="cTurn">Turn 1</span>
    <span class="chip" id="cQueue">Threats 0/0</span>
    <span class="chip" id="cNext">Next threat in 3 turns</span>
    <span class="chip" id="cTier">Market tier: base</span>
    <span class="spacer"></span>
    <button class="tbtn" id="btnDeck">Deck</button>
    <button class="tbtn" id="btnTrash">Trash</button>
    <button class="tbtn" id="btnRestart">New run</button>
  </div>

  <div id="main">
    <div id="jokers"></div>

    <div class="market-rail">
      <div class="rail-label">Market</div>
      <div class="market" id="market"></div>
    </div>

    <div id="threats"></div>

    <div id="bar">
      <div class="res" id="rAct">⚡ Actions <b>1</b></div>
      <div class="res" id="rBuy">🛒 Buys <b>1</b></div>
      <div class="res coin" id="rCoin">🪙 Coin <b>0</b></div>
      <span class="spacer"></span>
      <button class="pile" id="pTreas" title="Play every Treasure in your hand (T)">Play treasures</button>
      <button class="pile" id="pDeck">Draw 5</button>
      <button class="pile" id="pDisc">Discard 0</button>
      <button id="endturn" title="End turn (E)">End turn</button>
    </div>

    <div id="handwrap"><div id="hand"></div></div>
  </div>

  <div id="side">
    <div class="side-h">Ledger</div>
    <div id="log"></div>
  </div>
</div>

<div id="veil">
  <h2 id="mTitle"></h2>
  <div class="sub" id="mSub"></div>
  <div id="pool"></div>
  <div class="opts" id="mOpts"></div>
  <div class="mbtns" id="mBtns"></div>
</div>

<div id="over">
  <h1 id="overTitle">Run over</h1>
  <p id="overText"></p>
  <button class="mbtn go" id="overBtn">Start a new run</button>
</div>

<script>
"use strict";
/* ==========================================================
   Dominion: Crisis — an endless deckbuilder with no combat.
   Your deck persists from wave to wave. Threats queue up and
   demand resources; jokers bend the rules between waves.
   ========================================================== */

const rnd  = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function wpick(pairs){ const tot=pairs.reduce((s,p)=>s+p[1],0); let r=Math.random()*tot;
  for(const [k,w] of pairs){ if(r<w) return k; r-=w; } return pairs[pairs.length-1][0]; }
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const plural = (n,w,p) => `${n} ${n===1?w:(p||w+'s')}`;

const TUNE = {
  slots:3, handSize:5, jokerSlots:5, marketSize:6,
  threatsInWave: w => Math.min(8, 2+Math.floor(w/2)),
  spawnEvery:    w => w<9 ? 3 : 2,          // a queued threat arrives every Nth turn of a wave
  eliteEvery:3,                             // every Nth wave ends with an Elite
  enrageAfter:8,                            // threats standing this many turns attack every turn
  coinScale:  w => Math.pow(1.3, w-1),      // coin demands grow exponentially
  countScale: w => 1 + 0.22*(w-1),          // action / buy / discard demands grow linearly
  maxTier:    w => Math.floor((w-1)/2),     // market tier: base on waves 1-2, + on 3-4, ++ on 5-6 ...
};

/* ==========================================================
   CARDS — every card has tiers. Village, Village+, Village++…
   fx(self, lv) runs the card at its tier.
   ========================================================== */
const DB={};
function def(k,o){ DB[k]=Object.assign({key:k,step:3},o); }
const plus = lv => lv<=0 ? '' : lv<=3 ? '+'.repeat(lv) : `+${lv}`;
const tierName = lv => lv<=0 ? 'base' : plus(lv);

def('copper',{n:'Copper',c:0,step:2,t:'treasure',v:1,art:'🥉'});
def('silver',{n:'Silver',c:3,step:4,t:'treasure',v:2,art:'🥈'});
def('gold',  {n:'Gold',  c:6,step:5,t:'treasure',v:3,art:'🥇'});
def('bank',  {n:'Bank',  c:7,step:4,t:'treasure',kingdom:true,art:'🏦',
  tx:l=>`+${1+l} Coin for each Treasure you have in play, counting this.`});

def('estate',{n:'Estate',c:2,t:'victory',noLv:true,art:'🏡',tx:'Dead weight. Trash it or feed it to a threat.'});
def('curse', {n:'Curse', c:0,t:'curse',  noLv:true,art:'💀',tx:'Dead weight. Cannot be played.'});
def('bulk',  {n:'Bulk',  c:0,t:'junk',   noLv:true,art:'📦',tx:'Salvage left by a threat. Spend 1 Action to trash it for good.'});

const A = n => { if(G.phase==='attack') G.next.actions+=n; else G.actions+=n; };
const B = n => { if(G.phase==='attack') G.next.buys+=n;    else G.buys+=n; };
const C = n => { if(G.phase==='attack') G.next.coin+=n;    else G.coin+=n; };

/* --- draw & actions --- */
def('village',{n:'Village',c:3,art:'🏘',t:'action',
  tx:l=>`+${plural(1+l,'Card')}, +${2+Math.floor(1.5*l)} Actions.`,
  fx:async(s,l)=>{ draw(1+l); A(2+Math.floor(1.5*l)); }});
def('smithy',{n:'Smithy',c:4,art:'⚒',t:'action',
  tx:l=>`+${3+2*l} Cards.`,
  fx:async(s,l)=>{ draw(3+2*l); }});
def('laboratory',{n:'Laboratory',c:5,art:'⚗',t:'action',
  tx:l=>`+${2+l} Cards, +1 Action.`,
  fx:async(s,l)=>{ draw(2+l); A(1); }});
def('festival',{n:'Festival',c:5,art:'🎪',t:'action',
  tx:l=>`+${2+l} Actions, +${plural(1+Math.floor(l/2),'Buy')}, +${2+2*l} Coin.`,
  fx:async(s,l)=>{ A(2+l); B(1+Math.floor(l/2)); C(2+2*l); }});

/* --- deck control --- */
def('cellar',{n:'Cellar',c:2,step:2,art:'🪜',t:'action',
  tx:l=>`+1 Action. Discard any number of cards, then draw that many${l?` +${l}`:''}.`,
  fx:async(s,l)=>{ A(1);

   STATE

let G=null, busy=false, tid=0, uid=0;
function mk(key,lv=0){ return {uid:++uid,key,lv:DB[key].noLv?0:lv,t:DB[key].t}; }
function pull(a,c){const i=a.indexOf(c);if(i>=0)a.splice(i,1);return i>=0;}
const cname = c => DB[c.key].n+plus(c.lv);
const ctext = c => { const d=DB[c.key];
  if(typeof d.tx==='function') return d.tx(c.lv);
  if(d.tx) return d.tx;
  return `+${d.v*(1+c.lv)} Coin`; };
const baseCost = c => DB[c.key].c + DB[c.key].step*c.lv;
const costOf   = c => Math.max(0, baseCost(c)-(G?G.discount:0));
const allCards = () => [...G.deck,...G.hand,...G.discard,...G.inPlay];
const deckSize = () => allCards().length;
const countKey = k => allCards().filter(c=>c.key===k).length;
const handSize = () => TUNE.handSize+(hasJ('greedy')?1:0);
const waveCleared = () => !G.queue.length && G.slots.every(s=>!s);

function loadBest(){ try{ return +localStorage.getItem('dcrisis.best')||0; }catch(e){ return 0; } }
function saveBest(n){ try{ if(n>loadBest()) localStorage.setItem('dcrisis.best',String(n)); }catch(e){} }

function newRun(){
  G={ deck:[],hand:[],discard:[],inPlay:[],trash:[],
      coin:0,actions:0,buys:0,actionsPlayed:0,treasuresPlayed:0,discount:0,echoUsed:false,wallUsed:false,
      market:[], slots:new Array(TUNE.slots).fill(null), queue:[],
      wave:0, turn:0, turnInWave:0, waveTotal:0, runCleared:0,
      jokers:[], next:{actions:0,buys:0,coin:0}, phase:'turn', over:false };
  for(let i=0;i<7;i++)G.deck.push(mk('copper'));
  for(let i=0;i<3;i++)G.deck.push(mk('estate'));
  $('over').classList.remove('on'); $('log').innerHTML='';
  log('Your dominion braces for an endless crisis. Your deck is yours for the whole run — build it with care.','hl');
  startWave(1);
}

function newThreat(key,w,elite){
  const d=THREATS[key], cs=TUNE.coinScale(w), ks=TUNE.countScale(w), em=elite?1.8:1, steps=Math.floor((w-1)/3);
  const t={key,...d,atk:{...d.atk},prog:0,id:++tid,elite:!!elite,age:0};
  switch(d.kind){
    case 'prog_coin': case 'once_coin': t.need=Math.round(d.need*cs*em); break;
    case 'prog_action': case 'prog_buy': case 'prog_discard': t.need=Math.round(d.need*ks*em); break;
    case 'sacrifice':   t.need=Math.round((d.need+steps)*em); break;
    case 'panic':       t.curses=Math.round((d.curses+steps)*em); break;
    case 'once_hybrid': t.needCoin=Math.round(d.needCoin*cs*em); t.needAct=Math.round((d.needAct+steps)*em); break;
    case 'upgrade':     t.needT=t.needA=Math.round((1+Math.floor((w-1)/4))*em); t.gotT=t.gotA=0; break;
  }
  if(t.atk.n) t.atk.n+=Math.floor((w-1)/5);
  if(elite){ t.n='Elite '+d.n; t.atk.every=Math.max(1,d.atk.every-1); }
  t.cd=effEvery(t);
  return t;
}
function effEvery(t){
  if(t.age>=TUNE.enrageAfter) return 1;
  return Math.max(1, t.atk.every-(hasJ('glass')?1:0));
}

/* ---------- market ---------- */
function rollTier(){ const m=TUNE.maxTier(G.wave); return Math.max(0,wpick([[m,45],[m-1,35],[m-2,15],[m+1,5]])); }
function randomTreasure(){
  const w=G.wave;
  return mk(wpick([['copper',Math.max(6,40-w*6)],['silver',40],['gold',12+w*4]]),rollTier());
}
function marketCard(){ return mk(pick(KINGDOM),rollTier()); }
function ensureCoin(){ if(!G.market.some(c=>c&&c.t==='treasure')) G.market[G.market.length-1]=randomTreasure(); }
function newMarket(){
  G.market=[]; for(let i=0;i<TUNE.marketSize-1;i++) G.market.push(marketCard());
  G.market.splice(rnd(TUNE.marketSize),0,randomTreasure());
}
function cycleMarket(){
  const gone=G.market.splice(0,2);
  G.market.push(marketCard(),marketCard()); ensureCoin();
  log(`Market rotates: ${gone.map(cname).join(' and ')} leave the stalls.`);
}
function refillSlot(i,wasT){ G.market[i]= wasT?randomTreasure():marketCard(); ensureCoin(); }

/* ---------- deck ---------- */
function popDeck(){
  if(!G.deck.length){ if(!G.discard.length)return null;
    G.deck=shuffle(G.discard.slice()); G.discard=[]; log('You shuffle your discard pile back into your deck.'); }
  return G.deck.shift()||null;
}
function draw(n){ let g=0; for(let i=0;i<n;i++){const c=popDeck(); if(!c)break; G.hand.push(c); g++;} return g; }
function gatherDeck(){
  G.deck=shuffle([...G.deck,...G.hand,...G.discard,...G.inPlay]);
  G.hand=[]; G.discard=[]; G.inPlay=[];
}
function trashCard(c,quiet){
  G.trash.push(c);
  const scrap=hasJ('scrapper'); if(scrap) C(2);
  if(!quiet||scrap) log(`${cname(c)} is trashed${scrap?' (+2 Scrapper)':''}.`);
}
// Curses and Bulk arriving from threats — a Watchtower in hand turns them away.
function gainJunk(key,n,where='discard'){
  if(n<=0) return;
  if(G.hand.some(c=>c.key==='watchtower')){
    for(let i=0;i<n;i++) trashCard(mk(key),true);
    log(`Watchtower turns away ${plural(n,DB[key].n)}.`,'good'); return;
  }
  for(let i=0;i<n;i++){ const c=mk(key);
    if(where==='deck') G.deck.splice(rnd(G.deck.length+1),0,c); else G.discard.push(c); }
  log(`${plural(n,DB[key].n)} land${n===1?'s':''} in your ${where==='deck'?'draw pile':'discard pile'}.`,'bad');
}

function tval(c){
  let v = c.key==='bank'
    ? (1+c.lv)*(G.inPlay.filter(x=>x.t==='treasure'&&x!==c).length+1)
    : DB[c.key].v*(1+c.lv);
  if(hasJ('midas')) v+=1;
  if(hasJ('gilded')&&c.key==='copper') v+=2;
  const vin=G.jokers.find(j=>j.key==='vintage'); if(vin) v+=vin.age;
  if(hasJ('golden')) v*=2;
  if(hasJ('glass')) v*=3;
  if(hasJ('minimal')&&deckSize()<=15) v*=2;
  return v;
}

/* ==========================================================
   WAVES
   ========================================================== */
function startWave(w){
  G.wave=w; G.turnInWave=0;
  gatherDeck();
  const n=TUNE.threatsInWave(w), elite=w%TUNE.eliteEvery===0;
  const pool=THREAT_KEYS.filter(k=>w>=3||!THREATS[k].late);
  G.queue=[]; for(let i=0;i<n;i++) G.queue.push(newThreat(pick(pool),w,elite&&i===n-1));
  G.waveTotal=n;
  const prevTier=G.wave>1?TUNE.maxTier(w-1):0;
  newMarket();
  log(`Wave ${w}`,'wave');
  log(`${plural(n,'threat')} approach${elite?', led by an Elite':''}.`,'hl');
  if(TUNE.maxTier(w)>prevTier) log(`The market now stocks ${tierName(TUNE.maxTier(w))} tier cards.`,'good');
  spawnThreat();
  G.next={actions:0,buys:0,coin:0};
  draw(handSize());
  startTurn();
}

async function endWave(){
  G.phase='camp';
  log(`Wave ${G.wave} cleared!`,'good');
  saveBest(G.wave);
  G.jokers.forEach(j=>j.age++);
  gatherDeck(); G.coin=0; G.actions=0; G.buys=0; render();
  await sleep(350);
  await jokerDraft(G.wave%TUNE.eliteEvery===0?4:3);
  await campService();
  G.phase='turn';
  startWave(G.wave+1);
}

function rollJokers(n){
  const cand=Object.keys(JOKERS).filter(k=>!hasJ(k)), out=[];
  while(out.length<n&&cand.length){
    const k=wpick(cand.map(k=>[k,RARITY[JOKERS[k].r]]));
    out.push(k); pull(cand,k);
  }
  return out;
}

async function jokerDraft(n){
  const offers=rollJokers(n); if(!offers.length) return;
  const full=G.jokers.length>=TUNE.jokerSlots;
  const k=await chooseJoker(offers,`Wave ${G.wave} cleared — choose a joker`,
    full?`Your ${TUNE.jokerSlots} joker slots are full. Taking one means selling another.`
        :`Joker slots ${G.jokers.length}/${TUNE.jokerSlots}.${G.wave%TUNE.eliteEvery===0?' The Elite fell: an extra joker is on offer.':''}`);
  if(!k) return;
  if(full){
    const out=await chooseJoker(G.jokers.map(j=>j.key),`Sell a joker for ${JOKERS[k].n}?`,'Pick the joker to let go.',{skip:'Keep my jokers'});
    if(!out){ log(`You pass on ${JOKERS[k].n}.`); return; }
    G.jokers=G.jokers.filter(j=>j.key!==out);
    log(`${JOKERS[out].n} leaves your court.`);
  }
  G.jokers.push({key:k,age:0});
  log(`${JOKERS[k].art} ${JOKERS[k].n} joins your court.`,'good');
  render();
}

function deckSummary(){
  const all=allCards(), by=t=>all.filter(c=>c.t===t).length;
  const junk=all.filter(c=>DB[c.key].noLv).length;
  return `${all.length} cards — ${by('treasure')} Treasures, ${by('action')} Actions, ${junk} junk`;
}

async function campService(){
  const o=await chooseOption('The camp',`${deckSummary()}. Choose one service before wave ${G.wave+1}.`,[
    ['purge','🔥 Purge — trash up to 2 cards'],
    ['temper','⚒ Temper — upgrade a card one tier'],
    ['copy','📜 Duplicate — copy a card'],
    ['rest','Move on']]);
  const sorted=()=>G.deck.slice().sort((a,b)=>cname(a).localeCompare(cname(b)));
  if(o==='purge'){
    const s=await chooseCards(sorted(),{min:0,max:2,title:'Purge',sub:'Trash up to 2 cards from your deck for good.'});
    s.forEach(c=>{pull(G.deck,c);trashCard(c);});
  } else if(o==='temper'){
    const s=await chooseCards(sorted().filter(c=>!DB[c.key].noLv),{min:0,max:1,title:'Temper',
      sub:'Upgrade one card a tier.',badge:c=>DB[c.key].n+plus(c.lv+1)});
    if(s[0]){ const was=cname(s[0]); s[0].lv++; log(`${was} is tempered into ${cname(s[0])}.`,'good'); }
  } else if(o==='copy'){
    const s=await chooseCards(sorted().filter(c=>!DB[c.key].noLv),{min:0,max:1,title:'Duplicate',sub:'Add a copy of one card to your deck.'});
    if(s[0]){ G.deck.push(mk(s[0].key,s[0].lv)); log(`You copy ${cname(s[0])}.`,'good'); }
  }
}

/* ==========================================================
   THREAT FLOW
   ========================================================== */
function spawnThreat(){
  if(!G.queue.length) return true;
  const idx=G.slots.findIndex(s=>s===null);
  if(idx<0){
    const t=G.queue[0];
    lose(`${t.n} arrives with nowhere to stand`,
         `All ${TUNE.slots} slots were still occupied when the next threat came due.`);
    return false;
  }
  const t=G.queue.shift();
  t.fresh=true; t.age=0; t.cd=effEvery(t);
  G.slots[idx]=t;
  log(`${t.art} ${t.n} takes slot ${idx+1}.`,'bad');
  return true;
}

function completeThreat(t){
  const i=G.slots.indexOf(t); if(i<0) return;
  G.slots[i]=null;
  G.runCleared++;
  log(`${t.n} cleared.`,'good');
  gainJunk('bulk',1);
  if(hasJ('bounty')){ draw(1); A(1); C(2); log('Bounty Hunter pays out: +1 Card, +1 Action, +2 Coin.','good'); }
}

function isDone(t){
  switch(t.kind){
    case 'once_coin':   return t.need<=0;
    case 'once_hybrid': return t.needCoin<=0&&t.needAct<=0;
    case 'panic':       return t.curses<=0;
    case 'upgrade':     return t.gotT>=t.needT&&t.gotA>=t.needA;
  }
  return t.prog>=t.need;
}

// Reactions and jokers "strike" a threat: knock a fraction off what it demands.
function strike(t,frac){
  if(!G.slots.includes(t)) return;
  const hit=x=>Math.max(1,Math.ceil(x*frac));
  switch(t.kind){
    case 'once_coin':   { const d=hit(t.need); t.need=Math.max(0,t.need-d); log(`${t.n}'s fee drops by ${d}.`,'good'); break; }
    case 'once_hybrid': { const d=hit(t.needCoin); t.needCoin=Math.max(0,t.needCoin-d);
                          if(t.needCoin<=0) t.needAct=0; log(`${t.n}'s price drops by ${d} coin.`,'good'); break; }
    case 'panic':       { const d=hit(t.curses); t.curses=Math.max(0,t.curses-d); log(`${t.n} loses ${plural(d,'Curse')} from its terms.`,'good'); break; }
    case 'upgrade':     { if(t.gotT<t.needT) t.gotT++; else t.gotA++; log(`${t.n} collapses a little.`,'good'); break; }
    default:            { const d=hit(t.need); t.prog=Math.min(t.need,t.prog+d); log(`${t.n} takes ${d} progress.`,'good'); }
  }
  if(isDone(t)) completeThreat(t);
}

const coinMult = () => hasJ('interest')?2:1;
const unitMult = () => hasJ('clerk')?2:1;
const coinFor  = need => Math.ceil(need/coinMult());
const unitsFor = need => Math.ceil(need/unitMult());

function threatReady(t){
  switch(t.kind){
    case 'prog_coin':     return G.coin>0;
    case 'once_coin':     return G.coin>=coinFor(t.need);
    case 'prog_action':   return G.actions>0;
    case 'prog_buy':      return G.buys>0;
    case 'prog_discard':  return G.hand.length>0;
    case 'sacrifice':     return G.hand.some(c=>c.key!=='bulk');
    case 'panic':         return true;
    case 'once_hybrid':   return G.coin>=coinFor(t.needCoin) && G.actions>=unitsFor(t.needAct);
    case 'upgrade':       return G.hand.some(c=>(t.gotT<t.needT&&c.t==='treasure')||(t.gotA<t.needA&&c.t==='action'));
  }
  return false;
}

async function clickThreat(t){
  if(busy||G.over||!threatReady(t)) return;
  busy=true;
  try{
    const rem=t.need-t.prog;
    switch(t.kind){
      case 'prog_coin':{
        const amt=Math.min(G.coin,coinFor(rem));
        G.coin-=amt; t.prog=Math.min(t.need,t.prog+amt*coinMult());
        log(`You pour ${amt} coin into ${t.n} (${t.prog}/${t.need}).`,'hl'); break; }
      case 'once_coin':{
        const amt=coinFor(t.need); G.coin-=amt; t.need=0;
        log(`You pay ${amt} coin to ${t.n} in one stroke.`,'hl'); break; }
      case 'prog_action':{
        const amt=Math.min(G.actions,unitsFor(rem));
        G.actions-=amt; t.prog=Math.min(t.need,t.prog+amt*unitMult());
        log(`You burn ${plural(amt,'Action')} on ${t.n} (${t.prog}/${t.need}).`,'hl'); break; }
      case 'prog_buy':{
        const amt=Math.min(G.buys,unitsFor(rem));
        G.buys-=amt; t.prog=Math.min(t.need,t.prog+amt*unitMult());
        log(`You trade away ${plural(amt,'Buy')} to ${t.n} (${t.prog}/${t.need}).`,'hl'); break; }
      case 'prog_discard':{
        const s=await chooseCards(G.hand,{min:0,max:rem,title:t.n,sub:`Discard cards into it. ${rem} still wanted.`});
        s.forEach(c=>{pull(G.hand,c);G.discard.push(c);});
        t.prog+=s.length;
        if(s.length) log(`You feed ${plural(s.length,'card')} to ${t.n} (${t.prog}/${t.need}).`,'hl'); break; }
      case 'sacrifice':{
        const s=await chooseCards(G.hand.filter(c=>c.key!=='bulk'),{min:0,max:rem,title:t.n,
          sub:`Trash cards into the shrine. ${rem} still wanted. Bulk is refused.`});
        s.forEach(c=>{pull(G.hand,c);trashCard(c);});
        t.prog+=s.length;
        if(s.length) log(`You sacrifice ${plural(s.length,'card')} to ${t.n} (${t.prog}/${t.need}).`,'hl'); break; }
      case 'panic':{
        const ok=await chooseOption(t.n,`Sign the pact? It clears at once and ${plural(t.curses,'Curse')} go into your discard pile.`,
          [['y','Sign it'],['n','Step back']]);
        if(ok!=='y') break;
        log(`You sign the ${t.n}.`,'bad');
        gainJunk('curse',t.curses); t.curses=0; break; }
      case 'once_hybrid':{
        const c=coinFor(t.needCoin), a=unitsFor(t.needAct);
        G.coin-=c; G.actions-=a; t.needCoin=0; t.needAct=0;
        log(`You hand ${t.n} ${c} coin and ${plural(a,'Action')} at once.`,'hl'); break; }
      case 'upgrade':{
        const elig=G.hand.filter(c=>(t.gotT<t.needT&&c.t==='treasure')||(t.gotA<t.needA&&c.t==='action'));
        const s=await chooseCards(elig,{min:0,max:(t.needT-t.gotT)+(t.needA-t.gotA),title:t.n,
          sub:`Still needed: ${plural(t.needT-t.gotT,'Treasure')} and ${plural(t.needA-t.gotA,'Action')}.`});
        for(const c of s){
          if(c.t==='treasure'&&t.gotT<t.needT) t.gotT++;
          else if(c.t==='action'&&t.gotA<t.needA) t.gotA++;
          else continue;
          pull(G.hand,c); trashCard(c,true);
          log(`${cname(c)} is swallowed by ${t.n}.`,'hl');
        } break; }
    }
    if(isDone(t)) completeThreat(t);
    if(waveCleared()) await endWave();
  } finally { busy=false; render(); }
}

/* ---------- attacks ---------- */
function atkText(t){
  const a=t.atk, n=a.n;
  switch(a.k){
    case 'grow':    return `its demand grows ${a.pct}%`;
    case 'discard': return `discard ${plural(n,'random card')} from your hand`;
    case 'trash':   return `trash ${plural(n,a.filter?'random Treasure':'random card')} from your hand`;
    case 'bulk':    return `${n} Bulk into your discard pile`;
    case 'curse':   return `${plural(n,'Curse')} into your discard pile`;
    case 'nobuy':   return `−${plural(n,'Buy')} next turn`;
    case 'price':   return `the pact demands ${plural(n,'more Curse','more Curses')}`;
    case 'warp':    return `${n} Bulk shuffled into your draw pile`;
  }
  return '';
}

function applyAttack(t){
  const a=t.atk, n=a.n;
  switch(a.k){
    case 'grow':
      if(t.kind==='once_hybrid') t.needCoin=Math.ceil(t.needCoin*(1+a.pct/100));
      else t.need=Math.ceil(t.need*(1+a.pct/100));
      log(`${t.n} now wants ${t.kind==='once_hybrid'?t.needCoin:t.need}.`,'bad'); break;
    case 'discard':
      for(let i=0;i<n&&G.hand.length;i++){ const c=pick(G.hand); pull(G.hand,c); G.discard.push(c);
        log(`${cname(c)} is knocked from your hand.`,'bad'); } break;
    case 'trash':
      for(let i=0;i<n;i++){ const pool=G.hand.filter(c=>!a.filter||c.t===a.filter); if(!pool.length)break;
        const c=pick(pool); pull(G.hand,c); trashCard(c,true); log(`${t.n} destroys your ${cname(c)}.`,'bad'); } break;
    case 'bulk':  gainJunk('bulk',n); break;
    case 'curse': gainJunk('curse',n); break;
    case 'nobuy': G.next.buys-=n; break;
    case 'price': t.curses+=n; log(`${t.n} now costs ${plural(t.curses,'Curse')}.`,'bad'); break;
    case 'warp':  gainJunk('bulk',n,'deck'); break;
  }
}

function blocked(t){
  if(hasJ('thorns')&&G.slots.includes(t)){ log('Thorns bite back.','good'); strike(t,.2); }
}

async function resolveAttack(t){
  const a=t.atk, txt=atkText(t);
  log(`${t.art} ${t.n} — ${a.name}: ${txt}.`,'bad');
  if(hasJ('wall')&&!G.wallUsed){ G.wallUsed=true; log('Iron Wall absorbs the blow.','good'); blocked(t); return; }
  const best=f=>G.hand.filter(f).sort((x,y)=>y.lv-x.lv)[0];
  const moat =best(c=>c.key==='moat');
  const rip  =best(c=>c.key==='riposte');
  const snare=best(c=>c.key==='snare'&&(!t.elite||c.lv>=1));
  const opts=[];
  if(moat)  opts.push(['moat', `🌊 Reveal ${cname(moat)} — block`]);
  if(rip)   opts.push(['rip',  `🤺 Discard ${cname(rip)} — block & strike ${ripPct(rip.lv)}%`]);
  if(snare) opts.push(['snare',`🪤 Trash ${cname(snare)} — destroy it`]);
  if(opts.length){
    opts.push(['take','Take the hit']);
    const ch=await chooseOption(`${t.art} ${t.n} attacks!`,`${a.name}: ${txt}.`,opts);
    if(ch==='moat'){ log(`You reveal ${cname(moat)}. The attack washes away.`,'good'); blocked(t); return; }
    if(ch==='rip'){ pull(G.hand,rip); G.discard.push(rip);
      log(`${cname(rip)} parries and strikes back!`,'good'); blocked(t); strike(t,ripPct(rip.lv)/100); return; }
    if(ch==='snare'){ pull(G.hand,snare); trashCard(snare,true);
      log(`${cname(snare)} springs shut on ${t.n}!`,'good'); completeThreat(t); return; }
  }
  applyAttack(t);
}

/* ==========================================================
   CARD PLAY / BUY
   ========================================================== */
function canPlay(c){
  if(G.over||G.phase!=='turn') return false;
  if(c.t==='treasure') return true;
  if(c.key==='bulk')   return G.actions>0||hasJ('tidy');
  if(c.t==='action')   return G.actions>0;
  return false;                      // Estate, Curse
}

function playTreasure(c){
  pull(G.hand,c); G.inPlay.push(c);
  let v=tval(c);
  if(hasJ('mirror')&&G.treasuresPlayed===0){ v*=2; log('Mirror doubles it.','hl'); }
  G.treasuresPlayed++;
  C(v); log(`${cname(c)} adds ${v} to your purse.`);
}

async function runAction(c){
  G.actionsPlayed++;
  if(hasJ('momentum')&&G.actionsPlayed>1){ C(G.actionsPlayed-1); log(`Momentum: +${G.actionsPlayed-1} Coin.`,'hl'); }
  await DB[c.key].fx(c,c.lv);
}

async function playCard(c){
  if(busy||!canPlay(c)||!G.hand.includes(c)) return;
  busy=true;
  try{
    if(c.t==='treasure') playTreasure(c);
    else if(c.key==='bulk'){
      if(!hasJ('tidy')) G.actions--;
      pull(G.hand,c); trashCard(c,true);
      log('You haul the Bulk away. It is gone from your deck for good.','good');
      if(hasJ('tidy')) draw(1);
    } else {
      G.actions--; pull(G.hand,c); G.inPlay.push(c);
      log(`You play ${cname(c)}.`,'hl');
      const times=(hasJ('echo')&&!G.echoUsed)?2:1; G.echoUsed=true;
      for(let i=0;i<times;i++){ if(i) log('Echo — it resolves again.','hl'); await runAction(c); render(); }
    }
  } finally { busy=false; render(); }
}

async function playAllTreasures(){
  if(busy||G.over||G.phase!=='turn') return;
  const tr=G.hand.filter(c=>c.t==='treasure').sort((a,b)=>(a.key==='bank')-(b.key==='bank'));
  if(!tr.length) return;
  tr.forEach(playTreasure); render();
}

function buyCard(i){
  if(busy||G.over||G.phase!=='turn') return;
  const c=G.market[i]; if(!c) return;
  const price=costOf(c);
  if(G.buys<1||G.coin<price) return;
  G.buys--; G.coin-=price;
  const wasT=(c.t==='treasure');
  G.market[i]=null;
  G.deck.push(c);
  log(`You buy ${cname(c)} for ${price}. It waits at the bottom of your deck.`,'hl');
  refillSlot(i,wasT);
  render();
}

/* ==========================================================
   TURN FLOW
   ========================================================== */
function startTurn(){
  G.turn++; G.turnInWave++;
  const n=G.next;
  G.actions=Math.max(0,1+n.actions+(hasJ('wind')?1:0));
  G.buys=Math.max(0,1+n.buys+(hasJ('seal')?1:0));
  G.coin=Math.max(0,n.coin);
  if(hasJ('hoarder')) G.coin+=Math.floor(deckSize()/4);
  if(hasJ('trophy'))  G.coin+=Math.floor(G.runCleared/2);
  G.discount=hasJ('seal')?1:0;
  G.actionsPlayed=0; G.treasuresPlayed=0; G.echoUsed=false;
  G.next={actions:0,buys:0,coin:0};
  G.slots.forEach(t=>{ if(t) t.fresh=false; });
  log(`— Wave ${G.wave} · Turn ${G.turnInWave} —`,'turn');
  render();
}

async function endTurn(){
  if(busy||G.over||G.phase!=='turn') return; busy=true;
  try{
    const carry=hasJ('piggy')?Math.floor(G.coin/2):0;
    if(carry) log(`Piggy Bank keeps ${carry} coin for next turn.`);
    for(const c of G.inPlay.splice(0)) G.discard.push(c);
    for(const c of G.hand.splice(0))   G.discard.push(c);
    G.coin=0; G.actions=0; G.buys=0;
    G.next={actions:0,buys:0,coin:carry};

    draw(handSize());
    render(); await sleep(180);

    // threats strike at the hand you just drew — reactions in it can answer
    G.phase='attack'; G.wallUsed=false;
    for(const t of G.slots.slice()){
      if(!t||!G.slots.includes(t)) continue;
      t.age++; t.cd--;
      if(t.cd<=0){
        t.cd=effEvery(t); render();
        await resolveAttack(t); render();
        if(G.over) return;
        await sleep(160);
      }
    }
    G.phase='turn';
    if(waveCleared()){ await endWave(); return; }

    cycleMarket(); render(); await sleep(200);

    const due=G.turnInWave%TUNE.spawnEvery(G.wave)===0 || G.slots.every(s=>!s);
    if(due&&G.queue.length){ if(!spawnThreat()) return; await sleep(220); }
    startTurn();
  } finally { if(G.phase==='attack') G.phase='turn'; busy=false; render(); }
}

function lose(title,text){
  G.over=true;
  const cleared=G.wave-1; saveBest(cleared);
  $('overTitle').textContent='Run over';
  $('overText').textContent=`${title}. ${text} You survived ${plural(cleared,'wave')} and cleared ${plural(G.runCleared,'threat')} with a deck of ${deckSize()} cards. Best run: ${plural(loadBest(),'wave')} cleared.`;
  $('over').classList.add('on');
}

/* ==========================================================
   MODALS
   ========================================================== */
function closeVeil(){ $('veil').classList.remove('on'); $('pool').innerHTML=''; $('mOpts').innerHTML=''; $('mBtns').innerHTML=''; }

function chooseCards(pool,{min=0,max=1,title='Choose',sub='',badge=null}={}){
  return new Promise(res=>{
    if(!pool.length||max<=0){ res([]); return; }
    const chosen=new Set();
    $('mTitle').textContent=title; $('mSub').textContent=sub;
    const p=$('pool'); p.innerHTML=''; $('mOpts').innerHTML=''; $('mBtns').innerHTML='';
    const ok=document.createElement('button'); ok.className='mbtn go';
    const upd=()=>{ ok.textContent=chosen.size?`Confirm ${chosen.size}`:(min===0?'Skip':'Confirm'); ok.disabled=chosen.size<min; };
    pool.forEach(c=>{
      const el=cardEl(c,{badge}); el.style.cursor='pointer'; el.tabIndex=0;
      const tog=()=>{ if(chosen.has(c))chosen.delete(c); else{ if(chosen.size>=max){ if(max!==1)return; chosen.clear(); p.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected')); } chosen.add(c);}
        el.classList.toggle('selected',chosen.has(c)); upd(); };
      el.onclick=tog; el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tog();}};
      p.appendChild(el);
    });
    ok.onclick=()=>{closeVeil();res([...chosen]);};
    $('mBtns').appendChild(ok); upd();
    $('veil').classList.add('on'); ok.focus();
  });
}

function chooseOption(title,sub,options){
  return new Promise(res=>{
    $('mTitle').textContent=title; $('mSub').textContent=sub;
    $('pool').innerHTML=''; $('mBtns').innerHTML='';
    const box=$('mOpts'); box.innerHTML='';
    options.forEach(([k,label],i)=>{
      const b=document.createElement('button'); b.className='opt'; b.textContent=label;
      b.onclick=()=>{closeVeil();res(k);};
      box.appendChild(b); if(i===0) setTimeout(()=>b.focus(),0);
    });
    $('veil').classList.add('on');
  });
}

function chooseJoker(keys,title,sub,{skip='Skip'}={}){
  return new Promise(res=>{
    $('mTitle').textContent=title; $('mSub').textContent=sub;
    const p=$('pool'); p.innerHTML=''; $('mOpts').innerHTML=''; $('mBtns').innerHTML='';
    keys.forEach(k=>{
      const el=jokerCardEl(k); el.tabIndex=0;
      el.onclick=()=>{closeVeil();res(k);};
      el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();closeVeil();res(k);}};
      p.appendChild(el);
    });
    const b=document.createElement('button'); b.className='mbtn'; b.textContent=skip;
    b.onclick=()=>{closeVeil();res(null);};
    $('mBtns').appendChild(b);
    $('veil').classList.add('on');
    setTimeout(()=>{ const f=p.querySelector('.jcard'); if(f) f.focus(); },0);
  });
}

function viewPile(title,pile){
  const list=pile.slice().sort((a,b)=>cname(a).localeCompare(cname(b)));
  $('mTitle').textContent=title; $('mSub').textContent=plural(pile.length,'card');
  const p=$('pool'); p.innerHTML=''; $('mOpts').innerHTML=''; $('mBtns').innerHTML='';
  list.forEach(c=>p.appendChild(cardEl(c)));
  const b=document.createElement('button'); b.className='mbtn'; b.textContent='Close'; b.onclick=closeVeil;
  $('mBtns').appendChild(b); $('veil').classList.add('on'); b.focus();
}

/* ==========================================================
   RENDER
   ========================================================== */
function cardEl(c,{badge}={}){
  const d=DB[c.key], el=document.createElement('div');
  el.className=`card t-${d.t}${d.r?' r':''}${c.lv?` lv${Math.min(3,c.lv)}`:''}`;
  const kind=d.r?'Reaction':({treasure:'Treasure',action:'Action',victory:'Victory',junk:'Junk',curse:'Curse'}[d.t]||d.t);
  el.innerHTML=`<div class="banner">${cname(c)}</div>
    <div class="art">${d.art||'✦'}</div>
    <div class="tx">${ctext(c)}</div>
    <div class="foot"><span>${kind}</span><span>${c.lv?'T'+c.lv:''}</span></div>`;
  const cost=document.createElement('div'); cost.className='cost'; cost.textContent=costOf(c);
  el.appendChild(cost);
  if(badge){ const b=document.createElement('div'); b.className='badge'; b.textContent=badge(c); el.appendChild(b); }
  return el;
}

function jokerCardEl(k){
  const j=JOKERS[k], el=document.createElement('div');
  el.className=`jcard ${j.r}`;
  el.innerHTML=`<div class="jr">${j.r}</div><div class="jart">${j.art}</div><div class="jn">${j.n}</div><div class="jtx">${j.tx}</div>`;
  return el;
}

function threatProgress(t){
  const cm=coinMult()>1?' (×2)':'', um=unitMult()>1?' (×2)':'';
  switch(t.kind){
    case 'prog_coin':    return {pct:t.prog/t.need, left:`${t.prog} / ${t.need} coin`, note:`${t.need-t.prog} owed${cm}`};
    case 'once_coin':    return {pct:Math.min(1,G.coin/Math.max(1,coinFor(t.need))), left:`${t.need} coin at once${cm}`, note:`you hold ${G.coin}`};
    case 'prog_action':  return {pct:t.prog/t.need, left:`${t.prog} / ${t.need} Actions`, note:`${t.need-t.prog} owed${um}`};
    case 'prog_buy':     return {pct:t.prog/t.need, left:`${t.prog} / ${t.need} Buys`, note:`${t.need-t.prog} owed${um}`};
    case 'prog_discard': return {pct:t.prog/t.need, left:`${t.prog} / ${t.need} cards fed`, note:`${t.need-t.prog} wanted`};
    case 'sacrifice':    return {pct:t.prog/t.need, left:`${t.prog} / ${t.need} cards trashed`, note:`${t.need-t.prog} wanted`};
    case 'panic':        return {pct:0, left:'instant', note:`costs ${plural(t.curses,'Curse')}`};
    case 'once_hybrid':  { const nc=Math.max(1,coinFor(t.needCoin)), na=Math.max(1,unitsFor(t.needAct));
                           return {pct:Math.min(1,(Math.min(G.coin,nc)/nc*0.75)+(Math.min(G.actions,na)/na*0.25)),
                                   left:`${t.needCoin} coin + ${t.needAct} Actions`, note:`you hold ${G.coin} / ${G.actions}`}; }
    case 'upgrade':      return {pct:(t.gotT+t.gotA)/(t.needT+t.needA),
                                 left:`Treasure ${t.gotT}/${t.needT} · Action ${t.gotA}/${t.needA}`, note:'trash from hand'};
  }
  return {pct:0,left:'',note:''};
}
function threatButton(t){
  const rem=t.need-t.prog;
  switch(t.kind){
    case 'prog_coin':    return `Deposit ${Math.min(G.coin,coinFor(rem))} coin`;
    case 'once_coin':    return `Pay ${coinFor(t.need)} coin`;
    case 'prog_action':  return `Spend ${plural(Math.min(G.actions,unitsFor(rem)),'Action')}`;
    case 'prog_buy':     return `Spend ${plural(Math.min(G.buys,unitsFor(rem)),'Buy')}`;
    case 'prog_discard': return 'Feed cards';
    case 'sacrifice':    return 'Sacrifice cards';
    case 'panic':        return 'Sign the pact';
    case 'once_hybrid':  return `Pay ${coinFor(t.needCoin)} coin + ${plural(unitsFor(t.needAct),'Action')}`;
    case 'upgrade':      return 'Trash into the rift';
  }
  return 'Act';
}

function render(){
  if(!G) return;
  const live=!busy&&!G.over&&G.phase==='turn';

  $('cWave').textContent=`Wave ${G.wave}`;
  $('cTurn').textContent=`Turn ${G.turnInWave}`;
  const remaining=G.queue.length+G.slots.filter(s=>s).length;
  $('cQueue').textContent=`Threats ${remaining} / ${G.waveTotal}`;
  $('cTier').textContent=`Market tier: ${tierName(TUNE.maxTier(G.wave))}`;
  const every=TUNE.spawnEvery(G.wave), untilSpawn=G.slots.every(s=>!s)?0:every-(G.turnInWave%every||every);
  const nx=$('cNext');
  if(!G.queue.length){ nx.textContent='No more threats this wave'; nx.className='chip'; }
  else {
    nx.textContent = untilSpawn===0 ? 'Next threat at end of this turn'
                   : `Next threat in ${plural(untilSpawn,'turn')}`;
    nx.className='chip'+(untilSpawn===0?' now':untilSpawn===1?' soon':'');
  }

  // jokers
  const J=$('jokers'); J.innerHTML='<span class="jlabel">JOKERS</span>';
  for(let i=0;i<TUNE.jokerSlots;i++){
    const j=G.jokers[i], el=document.createElement('div');
    if(!j){ el.className='joker empty'; el.textContent='—'; J.appendChild(el); continue; }
    const d=JOKERS[j.key], st=jokerStatus(j);
    el.className='joker '+d.r; el.tabIndex=0;
    el.innerHTML=`<span class="ja">${d.art}</span><span>${d.n}</span>${st?`<span class="js">${st}</span>`:''}
      <div class="jtip"><b>${d.n}</b> · <i>${d.r}</i><br>${d.tx}</div>`;
    J.appendChild(el);
  }

  // market
  const m=$('market'); m.innerHTML='';
  G.market.forEach((c,i)=>{
    const slot=document.createElement('div'); slot.className='slot'+(i<2?' leaving':'');
    if(c){
      const el=cardEl(c), price=costOf(c);
      const afford=G.buys>0&&G.coin>=price&&live;
      el.classList.toggle('buyable',afford); el.classList.toggle('dead',!afford);
      if(afford){ el.tabIndex=0; el.onclick=()=>buyCard(i); el.onkeydown=e=>{if(e.key==='Enter')buyCard(i);}; }
      slot.appendChild(el);
      if(i<2){ const tag=document.createElement('div'); tag.className='leaving-tag'; tag.textContent='leaves this turn'; slot.appendChild(tag); }
    }
    m.appendChild(slot);
  });

  // threats
  const T=$('threats'); T.innerHTML='';
  G.slots.forEach((t,i)=>{
    const box=document.createElement('div');
    if(!t){ box.className='tslot empty'; box.textContent=`SLOT ${i+1} — CLEAR`; T.appendChild(box); return; }
    const p=threatProgress(t), ready=threatReady(t)&&live;
    box.className='tslot'+(ready?' ready':'')+(t.fresh?' new':'')+(t.elite?' elite':'');
    const when=t.cd<=1?'at end of this turn':`in ${t.cd} turns`;
    box.innerHTML=`
      <div class="thead"><div class="tart">${t.art}</div>
        <div><div class="tname">${t.n}</div><div class="tkind">${t.label}</div></div></div>
      <div class="tdesc">${t.desc(t)}</div>
      <div class="tatk${t.cd<=1?' imminent':''}">⚔ <b>${t.atk.name}</b> ${when}: ${atkText(t)}.</div>
      <div class="tnum"><span>${p.left}</span><span style="color:var(--dim)">${p.note}</span></div>
      <div class="tbar"><div class="tfill ${t.bar}" style="width:${Math.round(Math.max(0,Math.min(1,p.pct))*100)}%"></div></div>`;
    const pips=document.createElement('div'); pips.className='pips';
    if(t.elite) pips.innerHTML+='<span class="pip elite">ELITE</span>';
    if(t.age>=TUNE.enrageAfter) pips.innerHTML+='<span class="pip">ENRAGED</span>';
    if(pips.innerHTML) box.appendChild(pips);
    const b=document.createElement('button');
    b.className='tbtn2'+(t.kind==='panic'?' blood':ready?' go':'');
    b.textContent=threatButton(t); b.disabled=!ready;
    b.onclick=()=>clickThreat(t);
    box.appendChild(b);
    T.appendChild(box);
  });

  // resources
  const r=(id,v,label,icon)=>{const e=$(id); e.innerHTML=`${icon} ${label} <b>${v}</b>`; e.classList.toggle('spent',v<=0);};
  r('rAct',G.actions,'Actions','⚡'); r('rBuy',G.buys,'Buys','🛒');
  $('rCoin').innerHTML=`🪙 Coin <b>${G.coin}</b>`;
  $('pDeck').textContent=`Draw ${G.deck.length}`;
  $('pDisc').textContent=`Discard ${G.discard.length}`;
  $('pTreas').disabled=!live||!G.hand.some(c=>c.t==='treasure');
  $('btnDeck').textContent=`Deck (${deckSize()})`;
  $('endturn').disabled=!live;

  // hand
  const h=$('hand'); h.innerHTML='';
  const cw=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-w'))||110;
  const fit=Math.min(-13,(($('handwrap').clientWidth-40)/Math.max(1,G.hand.length)-cw)/2);
  G.hand.forEach(c=>{
    const el=cardEl(c), ok=canPlay(c)&&live;
    el.style.margin=`0 ${fit}px`;
    el.classList.toggle('playable',ok); el.classList.toggle('dead',!ok);
    if(ok){ el.tabIndex=0; el.onclick=()=>playCard(c); el.onkeydown=e=>{if(e.key==='Enter')playCard(c);}; }
    h.appendChild(el);
  });
}

function log(msg,cls){
  const d=document.createElement('div'); if(cls)d.className=cls; d.textContent=msg;
  const l=$('log'); l.appendChild(d);
  while(l.children.length>200) l.removeChild(l.firstChild);
  l.scrollTop=l.scrollHeight;
}

/* ---------- wiring ---------- */
$('endturn').onclick=endTurn;
$('pTreas').onclick=playAllTreasures;
$('btnRestart').onclick=()=>{ if(!busy) newRun(); };
$('overBtn').onclick=newRun;
$('btnDeck').onclick=()=>viewPile('Your whole deck',allCards());
$('btnTrash').onclick=()=>viewPile('Trash',G.trash);
$('pDeck').onclick=()=>viewPile('Draw pile (sorted)',G.deck);
$('pDisc').onclick=()=>viewPile('Discard pile',G.discard);
document.addEventListener('keydown',e=>{
  if($('veil').classList.contains('on')||busy) return;
  if(e.key==='e') endTurn();
  if(e.key==='t') playAllTreasures();
});

newRun();
</script>
</body>
